[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axe-agent"
version = "0.2.0"
description = "Axe: Autonomous CLI agent with intelligent multi-model routing — costs 100x less than Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "openai>=1.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# uv installs this group by default (so `uv sync` + `uv run pytest` just works).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
axe = "axe.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/axe"]
include = ["src/axe/**/*.py", "src/axe/**/*.toml"]

[tool.hatch.build.targets.sdist]
include = [
    "src/axe",
    "tests",
    "README.md",
    "pyproject.toml",
    ".env.example",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
